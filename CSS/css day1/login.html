<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            background-color: #f3efff; /* Light purple background matching image */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background-color: #ffffff;
            width: 380px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-radius: 8px;
        }

        .login-title {
            text-align: center;
            color: #7b2cbf; /* Purple heading */
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2b2d42;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1px solid #dcd6f7;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #9d4edd;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .login-btn {
            background-color: #9d4edd;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #7b2cbf;
        }

        .forgot-link {
            color: #9d4edd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .signup-text {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #4a4e69;
        }

        .signup-text a {
            color: #9d4edd;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-title">Login</div>
        
        <form>
            <div class="form-group">
                <label>Email:</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password">
            </div>

            <div class="button-container">
                <button type="submit" class="login-btn">Login</button>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
        </form>

        <div class="signup-text">
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>

</body>
</html>
